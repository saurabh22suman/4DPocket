services:
  app:
    build: .
    init: true
    restart: unless-stopped
    expose:
      - "4040"
    environment:
      FDP_AUTH__MODE: multi
      FDP_AUTH__ALLOW_REGISTRATION: "false"
      FDP_AUTH__ALLOW_INVITES: "true"
      FDP_DATABASE__URL: sqlite:////data/4dpocket.db
      FDP_STORAGE__BASE_PATH: /data
      FDP_SEARCH__BACKEND: sqlite
      FDP_SERVER__PUBLIC_URL: ${FDP_SERVER__PUBLIC_URL:-https://4dpocket.thedutchrabbit.com}
      FDP_SERVER__SECURE_COOKIES: ${FDP_SERVER__SECURE_COOKIES:-true}
      FDP_EMAIL__SMTP_HOST: ${FDP_EMAIL__SMTP_HOST:-}
      FDP_EMAIL__SMTP_PORT: ${FDP_EMAIL__SMTP_PORT:-587}
      FDP_EMAIL__SMTP_USER: ${FDP_EMAIL__SMTP_USER:-}
      FDP_EMAIL__SMTP_PASSWORD: ${FDP_EMAIL__SMTP_PASSWORD:-}
      FDP_EMAIL__SMTP_USE_TLS: ${FDP_EMAIL__SMTP_USE_TLS:-true}
      FDP_EMAIL__SMTP_USE_SSL: ${FDP_EMAIL__SMTP_USE_SSL:-false}
      FDP_EMAIL__FROM_ADDRESS: ${FDP_EMAIL__FROM_ADDRESS:-}
      FDP_EMAIL__FROM_NAME: ${FDP_EMAIL__FROM_NAME:-4DPocket}
      FORWARDED_ALLOW_IPS: "*"
      FDP_AI__CHAT_PROVIDER: ${FDP_AI__CHAT_PROVIDER:-noop}
      FDP_AI__GROQ_API_KEY: ${FDP_AI__GROQ_API_KEY:-}
      FDP_AI__GROQ_MODEL: ${FDP_AI__GROQ_MODEL:-openai/gpt-oss-20b}
      FDP_ENRICHMENT__EXTRACT_ENTITIES: ${FDP_ENRICHMENT__EXTRACT_ENTITIES:-false}
    volumes:
      - pocket-data:/data

volumes:
  pocket-data:
